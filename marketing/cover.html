<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: var(--w); height: var(--h); overflow: hidden; font-family: 'Arial Black', 'Segoe UI', system-ui, sans-serif; }
  .bg { position: absolute; inset: 0; background: url(scene_landscape.png) var(--pos) / cover no-repeat; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,8,40,.55) 0%, rgba(10,8,40,0) 38%, rgba(10,8,40,0) 62%, rgba(10,8,40,.75) 100%); }
  .logo { position: absolute; left: 0; right: 0; top: var(--top); text-align: center; font-weight: 900; font-size: var(--fs); letter-spacing: .04em; line-height: .95; }
  .logo .a { color: #7cf; text-shadow: 0 0 .25em #39f, 0 .06em 0 #1b4f9a, 0 .1em .2em rgba(0,0,0,.6); }
  .logo .b { color: #ff6ad5; text-shadow: 0 0 .25em #f3a, 0 .06em 0 #8a1f6a, 0 .1em .2em rgba(0,0,0,.6); }
  .tag { position: absolute; left: 0; right: 0; bottom: var(--tagb); text-align: center; color: #fff; font-size: var(--tfs); font-weight: 900; text-shadow: 0 .08em .25em rgba(0,0,0,.8); }
  .tag b { color: #ffd75e; }
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <div class="logo"><span class="a">PORTAL</span><span class="sep"> </span><span class="b">DUEL</span></div>
  <div class="tag">Shoot <b>through portals</b> 🌀</div>
  <script>
    const q = new URLSearchParams(location.search);
    const set = (k, v) => document.documentElement.style.setProperty(k, v);
    for (const k of ['w','h','pos','top','fs','tagb','tfs']) if (q.get(k)) set('--' + k, q.get(k));
    if (q.get('stack')) document.querySelector('.sep').outerHTML = '<br>';
  </script>
</body></html>
